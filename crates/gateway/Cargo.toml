[package]
name = "cordex-gateway"
description = "Discord gateway for cordex: shards, automatic sharding, identify queue, event filter, standby."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cordex-gateway"
readme = "README.md"

[lints]
workspace = true

[features]
# Export shard counters through the `metrics` crate.
metrics = ["dep:metrics"]
# Record gateway dispatch payloads to JSONL files with optional anonymization.
record = []
# Use zstd-stream transport compression instead of zlib-stream (requires a C compiler).
zstd-stream = ["dep:zstd"]

[dependencies]
cordex-model.workspace = true
metrics = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
cordex-http = { workspace = true, default-features = false }
bitflags.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-websockets.workspace = true
flate2.workspace = true
bytes.workspace = true
http.workspace = true
fastrand.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde_json.workspace = true
futures-core.workspace = true
futures-sink.workspace = true
parking_lot.workspace = true
rustls.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
