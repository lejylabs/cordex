[package]
name = "cordex-model"
description = "Discord API v10 models for cordex: objects, events, flags, snowflakes, embeds, CDN URLs, mentions, permissions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cordex-model"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Direct PostgreSQL `ToSql`/`FromSql` for `Id<T>`, `Permissions`, `Timestamp`, `ImageHash`.
postgres-types = ["dep:postgres-types", "dep:bytes"]

[dependencies]

serde.workspace = true
serde_json.workspace = true
bitflags.workspace = true
thiserror.workspace = true
time.workspace = true
bytes = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
dhat.workspace = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "alloc"
harness = false
