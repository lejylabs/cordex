[package]
name = "cordex-voice"
description = "Pure-Rust Discord voice signaling and session coordination for cordex (Lavalink v4 & custom voice backends)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cordex-voice"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["gateway"]
# Implement `VoiceGateway` for `cordex_gateway::Shard` and `ShardManager`.
gateway = ["dep:cordex-gateway"]

[dependencies]
cordex-model.workspace = true
cordex-gateway = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
