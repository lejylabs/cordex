[package]
name = "drs"
description = "Independent Discord bot API library (facade crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
drs-model.workspace = true
drs-http = { workspace = true, optional = true }
drs-gateway = { workspace = true, optional = true }
drs-cache = { workspace = true, optional = true }
drs-interactions = { workspace = true, optional = true }

[features]
default = ["http", "gateway", "interactions"]
http = ["dep:drs-http"]
gateway = ["dep:drs-gateway"]
interactions = ["dep:drs-interactions"]
cache = ["dep:drs-cache"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
