[package]
name = "cordex"
description = "Independent Discord bot API library (facade crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cordex"
readme = "README.md"

[lints]
workspace = true

[dependencies]
cordex-model.workspace = true
cordex-http = { workspace = true, optional = true }
cordex-gateway = { workspace = true, optional = true }
cordex-interactions = { workspace = true, optional = true }
cordex-cache = { workspace = true, optional = true }
# Bounded parallel backfill (comes with `http` anyway).
tokio = { workspace = true, optional = true }
# Logs of the simple layer (handler errors, command registration).
tracing = { workspace = true, optional = true }

[features]
default = ["http", "gateway", "interactions", "bot"]
http = ["dep:cordex-http", "dep:tokio"]
gateway = ["dep:cordex-gateway"]
interactions = ["dep:cordex-interactions"]
# Simple layer (`Bot`, handler contexts) on top of the three crates.
bot = ["http", "gateway", "interactions", "dep:tracing"]
# In-memory cache; off by default, and every resource inside is off too.
cache = ["dep:cordex-cache"]
# Ed25519 check for HTTP interactions (any web framework).
interactions-verify = ["interactions", "cordex-interactions/verify"]
# Standalone hyper endpoint for HTTP interactions.
interactions-server = ["interactions-verify", "cordex-interactions/server"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
serde_json.workspace = true

[[example]]
name = "testbot"
required-features = ["cache"]

[package.metadata.docs.rs]
all-features = true
