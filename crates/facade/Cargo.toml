[package]
name = "cordex"
description = "Fast, independent Discord bot library for Rust: gateway, sharding, REST, interactions, optional cache and a simple Bot layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cordex"
readme = "README.md"
# The live test bot stays in the repository only; `examples/bot.rs` ships.
exclude = ["examples/testbot.rs"]

[lints]
workspace = true

[dependencies]
cordex-model.workspace = true
cordex-http = { workspace = true, default-features = false, optional = true }
cordex-gateway = { workspace = true, optional = true }
cordex-interactions = { workspace = true, optional = true }
cordex-cache = { workspace = true, optional = true }
# Bounded parallel backfill and graceful Ctrl+C shutdown in `Bot`.
tokio = { workspace = true, features = ["signal"], optional = true }
# Logs of the simple layer (handler errors, command registration).
tracing = { workspace = true, optional = true }
# Compare registered commands with the local ones (simple layer).
serde_json = { workspace = true, optional = true }

[features]
default = ["http", "http2", "gateway", "interactions", "bot"]
http = ["dep:cordex-http", "dep:tokio"]
# Negotiate HTTP/2 via ALPN on the REST client (disable for smaller binaries).
http2 = ["cordex-http?/http2"]
gateway = ["dep:cordex-gateway"]
interactions = ["dep:cordex-interactions"]
# Simple layer (`Bot`, handler contexts) on top of the three crates.
bot = ["http", "gateway", "interactions", "dep:tracing", "dep:serde_json"]
# In-memory cache; off by default, and every resource inside is off too.
cache = ["dep:cordex-cache"]
# Ed25519 check for HTTP interactions (any web framework).
interactions-verify = ["interactions", "cordex-interactions/verify"]
# Standalone hyper endpoint for HTTP interactions.
interactions-server = ["interactions-verify", "cordex-interactions/server"]
# Export HTTP and gateway counters through the `metrics` crate.
metrics = ["cordex-http?/metrics", "cordex-gateway?/metrics"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true
serde_json.workspace = true

[[example]]
name = "testbot"
required-features = ["cache"]

[[example]]
name = "cache_and_permissions"
required-features = ["cache"]

[[example]]
name = "interactions_http"
required-features = ["interactions-server"]

[package.metadata.docs.rs]
all-features = true
