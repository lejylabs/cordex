[package]
name = "cordex"
description = "Independent Discord bot API library (facade crate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cordex-model.workspace = true
cordex-http = { workspace = true, optional = true }
cordex-gateway = { workspace = true, optional = true }
cordex-cache = { workspace = true, optional = true }
cordex-interactions = { workspace = true, optional = true }

[features]
default = ["http", "gateway", "interactions"]
http = ["dep:cordex-http"]
gateway = ["dep:cordex-gateway"]
interactions = ["dep:cordex-interactions"]
cache = ["dep:cordex-cache"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
