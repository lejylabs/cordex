[package]
name = "cordex-http"
description = "Discord REST client for cordex: all endpoints typed, per-route and global rate limits, invalid request guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cordex-http"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["http2"]
# Negotiate HTTP/2 via ALPN (falls back to HTTP/1.1 automatically).
http2 = ["hyper/http2", "hyper-util/http2", "hyper-rustls/http2"]
# Export client counters through the `metrics` crate.
metrics = ["dep:metrics"]
# Discord OAuth2 client (authorize URLs, token exchange/refresh/revoke, bearer endpoints).
oauth2 = []

[dependencies]
cordex-model.workspace = true
metrics = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
rustls.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
fastrand.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
