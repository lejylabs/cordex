[package]
name = "Nexcord"
description = "Independent Discord API library for Rust."
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups: perf always fails the build, pedantic warns (CI uses -D warnings).
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic style lints that do not fit this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Performance lints outside the perf group (off by default).
needless_pass_by_value = "deny"
large_types_passed_by_value = "deny"
large_futures = "deny"
trivially_copy_pass_by_ref = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
inefficient_to_string = "deny"
format_push_string = "deny"
format_collect = "deny"
needless_collect = "deny"
or_fun_call = "deny"
manual_memcpy = "deny"
rc_buffer = "deny"
mutex_atomic = "deny"
string_lit_as_bytes = "deny"

# Correctness and hygiene.
redundant_clone = "deny"
enum_glob_use = "deny"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
too_many_arguments = "allow"
#large_enum_variant = "allow" # We often have large enum variants yet we rarely actually bother with splitting them up.

[dependencies]


[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "limited"
strip = "debuginfo"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
