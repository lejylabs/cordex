name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Remove bot tokens, interaction tokens and
        webhook URLs** from everything you paste. Security problems go to
        a private advisory, not here (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: cordex version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Rust version and OS
      placeholder: "rustc 1.100.0, Debian 13"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: rust
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: With `RUST_LOG=cordex_gateway=debug,cordex_http=debug` if possible.
      render: text
