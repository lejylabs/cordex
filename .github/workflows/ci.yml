# Same gate as locally: `cargo xtask check` and `cargo xtask features`.
# Actions are pinned to commit SHAs (supply chain); bump them on purpose.
# Keep actions/checkout too: tools that migrate runners may swap it for an
# unpinned variant.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # Prose-only changes skip the expensive jobs. Not `paths-ignore`: the
  # ruleset requires these checks, and a workflow that never starts leaves
  # them pending forever, while a job skipped by `if` counts as passed.
  # Only root-level `*.md` counts as prose: crate READMEs are rustdoc
  # (doctests), and `docs/` feeds `xtask coverage --check`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          zero=0000000000000000000000000000000000000000
          prose='^([^/]+\.md|LICENSE-[^/]+|book/.*|\.github/workflows/(pages|discord-docs)\.yml)$'
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] && [ "$BASE" != "$zero" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename' > files.txt; then
              count=$(grep -c . files.txt || true)
              # The compare API lists at most 300 files; run everything then.
              if [ "$count" -gt 0 ] && [ "$count" -lt 300 ] && ! grep -qvE "$prose" files.txt; then
                code=false
              fi
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  check:
    # Stable job names (`check (linux)`, `check (windows)`) so required
    # status checks survive runner label changes.
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Debian is the acceptance platform; Ubuntu is the closest runner.
        # Windows is the development platform. Runners: GitHub-hosted (free for public repos).
        include:
          - name: linux
            runner: ubuntu-latest
          - name: windows
            runner: windows-latest
    needs: changes
    # A matrix job skipped by `if` reports the unexpanded name
    # `check (${{ matrix.name }})`, so the required checks never resolve.
    # Instead it always runs, with every step skipped when nothing but
    # prose changed.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt
      # and clippy).
      - name: Install toolchain
        if: env.CODE == 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - if: env.CODE == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check

      - if: env.CODE == 'true'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.21.0

      - name: cargo xtask check
        if: env.CODE == 'true'
        run: cargo xtask check

  msrv:
    name: msrv (1.95)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must match `rust-version` in Cargo.toml.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.95 --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv

      - name: cargo +1.95 test
        run: cargo +1.95 test --workspace --all-features --locked

  features:
    name: feature combinations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: features

      - name: cargo xtask features
        run: cargo xtask features

  package:
    name: package (publish dry run)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package

      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run --locked

  coverage:
    # docs/coverage.md must match the code and the pinned docs commit, so
    # the coverage number in releases stays honest.
    name: coverage (docs/coverage.md)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage

      - name: cargo xtask coverage --check
        run: cargo xtask coverage --check

  wasm32:
    name: wasm32 (model & interactions)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain + wasm32 target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm32

      - name: cargo check wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown -p cordex-model -p cordex-interactions --no-default-features
