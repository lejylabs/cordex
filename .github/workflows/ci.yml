# Same gate as locally: `cargo xtask check` and `cargo xtask features`.
# Actions are pinned to commit SHAs (supply chain); bump them on purpose.
# Keep actions/checkout too: tools that migrate runners may swap it for an
# unpinned variant.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  check:
    # Stable job names (`check (linux)`, `check (windows)`) so required
    # status checks survive runner label changes.
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Debian is the acceptance platform; Ubuntu is the closest runner.
        # Windows is the development platform. Runners: Blacksmith.
        include:
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2604
          - name: windows
            runner: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt
      # and clippy).
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.21.0

      - name: cargo xtask check
        run: cargo xtask check

  features:
    name: feature combinations
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: features

      - name: cargo xtask features
        run: cargo xtask features

  package:
    name: package (publish dry run)
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package

      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run --locked
