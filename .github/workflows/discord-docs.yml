# Watches discord/discord-api-docs. When the docs move past the commit
# pinned in docs/discord-api-docs.rev, this compares both docs versions and
# opens (or updates and comments on) one issue labelled `discord-api-docs`:
# a checklist of new and removed endpoints, events, opcodes, close codes,
# component types and enum values, the changed bot API pages, and the
# coverage before and after.
#
# To take the new docs: `cargo xtask coverage --rev latest --pin`, review
# docs/coverage.md, close the gaps, commit.
name: Discord API docs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: discord-docs
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  watch:
    name: watch docs
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare pinned and latest docs commit
        id: rev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(tr -d '[:space:]' < docs/discord-api-docs.rev)"
          # GitHub API instead of git: runner git caches can be stale.
          latest="$(gh api repos/discord/discord-api-docs/commits/HEAD --jq .sha)"
          if ! printf '%s' "$latest" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not read the latest docs commit: $latest" >&2
            exit 1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then
            echo "Docs unchanged ($pinned)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install toolchain
        if: steps.rev.outputs.changed == 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.rev.outputs.changed == 'true'
        with:
          shared-key: coverage

      - name: Measure coverage and diff against the latest docs
        if: steps.rev.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.rev.outputs.latest }}
        run: |
          cargo xtask coverage --rev "$LATEST"
          {
            cat target/docs-changes.md
            echo
            echo "<details><summary>Full coverage report against the new docs</summary>"
            echo
            cat "target/coverage-${LATEST:0:12}.md"
            echo
            echo "</details>"
          } > issue.md
          # GitHub caps issue bodies at 65536 characters.
          head -c 65000 issue.md > body.md

      - name: Open or update the issue
        if: steps.rev.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.rev.outputs.latest }}
        run: |
          gh label create discord-api-docs --color 5865F2 \
            --description "Upstream Discord API docs changed" --force
          title="Discord API docs changed (${LATEST:0:12})"
          number="$(gh issue list --label discord-api-docs --state open --json number --jq '.[0].number')"
          if [ -z "$number" ]; then
            gh issue create --title "$title" --label discord-api-docs --body-file body.md
          elif ! gh issue view "$number" --json title --jq .title | grep -q "${LATEST:0:12}"; then
            # New docs commit since the issue was opened: refresh it and
            # comment, because edits alone send no notification.
            gh issue edit "$number" --title "$title" --body-file body.md
            gh issue comment "$number" --body "The docs moved again, now at \`${LATEST:0:12}\`. The checklist above is updated."
          fi
